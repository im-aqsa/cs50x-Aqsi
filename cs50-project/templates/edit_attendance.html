{% extends "layout.html" %}

{% block title %}
Edit Attendance
{% endblock %}

{% block content %}

<h2>Edit Attendance</h2>

<form action="{{ url_for('edit_attendance', id=attendance.id) }}" method="POST">

<div class="mb-3">

<label>Subject</label>

<select class="form-select" name="subject_id">

{% for subject in subjects %}

<option value="{{ subject.id }}"
{% if subject.id == attendance.subject_id %}selected{% endif %}>
{{ subject.subject_name }}
</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label>Date</label>

<input
type="date"
class="form-control"
name="date"
value="{{ attendance.date }}"
required>

</div>

<div class="mb-3">

<label>Status</label>

<select class="form-select" name="status">

<option value="Present"
{% if attendance.status == "Present" %}selected{% endif %}>
Present
</option>

<option value="Absent"
{% if attendance.status == "Absent" %}selected{% endif %}>
Absent
</option>

</select>

</div>

<button class="btn btn-complete">
Save Changes
</button>

</form>

{% endblock %}
