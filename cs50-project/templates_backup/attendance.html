{% extends "layout.html" %}

{% block title %}
Attendance
{% endblock %}

{% block content %}

<h2>Attendance</h2>

<a href="{{ url_for('add_attendance') }}"
class="btn btn-add mb-3">
Add Attendance
</a>

<table class="table table-bordered">

<tr>

<th>ID</th>
<th>Subject</th>
<th>Date</th>
<th>Status</th>
<th>Action</th>

</tr>

{% for row in attendance %}

<tr>

<td>{{ row.id }}</td>
<td>{{ row.subject_name }}</td>
<td>{{ row.date }}</td>
<td>{{ row.status }}</td>
<td>

    <a href="{{ url_for('edit_attendance', id=row.id) }}"
       class="btn btn-edit btn-sm">
        Edit
    </a>

    <a href="{{ url_for('delete_attendance', id=row.id) }}"
class="btn btn-delete btn-sm"
onclick="return confirm('Are you sure you want to delete this attendance record?')">
Delete
</a>

</td>

</tr>

{% endfor %}

</table>

{% endblock %}
