{% extends "layout.html" %}

{% block title %}
{{ note.title }}
{% endblock %}

{% block content %}

<h2>{{ note.title }}</h2>

<p>
    <strong>Subject:</strong>
    {{ note.subject_name }}
</p>

<hr>

<p style="white-space: pre-wrap;">
    {{ note.content }}
</p>

<a href="{{ url_for('notes') }}" class="btn btn-secondary">
    Back
</a>

{% endblock %}
