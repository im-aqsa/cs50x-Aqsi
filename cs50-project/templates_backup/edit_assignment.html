{% extends "layout.html" %}

{% block title %}
Edit Assignment
{% endblock %}

{% block content %}

<h2>Edit Assignment</h2>

<form action="{{ url_for('edit_assignment', id=assignment.id) }}" method="POST">

<div class="mb-3">

<label>Subject</label>

<select class="form-select" name="subject_id">

{% for subject in subjects %}

<option value="{{ subject.id }}"
{% if subject.id == assignment.subject_id %}selected{% endif %}>
{{ subject.subject_name }}
</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label>Title</label>

<input
class="form-control"
type="text"
name="title"
value="{{ assignment.title }}"
required>

</div>

<div class="mb-3">

<label>Due Date</label>

<input
class="form-control"
type="date"
name="due_date"
value="{{ assignment.due_date }}"
required>

</div>

<div class="mb-3">

<label>Status</label>

<select class="form-select" name="status">

<option value="Pending"
{% if assignment.status == "Pending" %}selected{% endif %}>
Pending
</option>

<option value="Completed"
{% if assignment.status == "Completed" %}selected{% endif %}>
Completed
</option>

</select>

</div>

<button class="btn btn-complete">
Save Changes
</button>

</form>

{% endblock %}
