{% extends "layout.html" %}

{% block title %}
Notes
{% endblock %}

{% block content %}

<h2>My Notes</h2>
<form method="GET" action="{{ url_for('notes') }}" class="mb-3">

<div class="input-group">

<input
type="text"
name="search"
class="form-control"
placeholder="Search Note..."
value="{{ request.args.get('search', '') }}">

<button class="btn btn-search">
Search
</button>

</div>

</form>

<a href="{{ url_for('add_note') }}" class="btn btn-add mb-3">
    Add Note
</a>

<table class="table table-bordered">

<tr>
    <th>ID</th>
    <th>Title</th>
    <th>Subject</th>
    <th>Action</th>
</tr>

{% for note in notes %}

<tr>

    <td>{{ note.id }}</td>

    <td>
    <a href="{{ url_for('note', id=note.id) }}">
        {{ note.title }}
    </a>
    <td>

<a href="{{ url_for('edit_note', id=note.id) }}"
class="btn btn-edit btn-sm">
Edit
</a>

<a href="{{ url_for('delete_note', id=note.id) }}"
class="btn btn-delete btn-sm"
onclick="return confirm('Are you sure you want to delete this note?')">
Delete
</a>

</td>
</td>

    <td>{{ note.subject_name }}</td>

</tr>
{% else %}

<tr>
    <td colspan="5" class="text-center">
        No notes found.
    </td>
</tr>

{% endfor %}

</table>

{% endblock %}
