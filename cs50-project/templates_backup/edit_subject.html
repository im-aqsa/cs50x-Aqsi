{% extends "layout.html" %}

{% block title %}
Edit Subject
{% endblock %}

{% block content %}

<h2>Edit Subject</h2>

<form action="{{ url_for('edit_subject', id=subject.id) }}" method="POST">

    <div class="mb-3">

        <label class="form-label">Subject Name</label>

        <input
            class="form-control"
            type="text"
            name="subject_name"
            value="{{ subject.subject_name }}"
            required>

    </div>

    <button class="btn btn-complete" type="submit">
        Save Changes
    </button>

</form>

{% endblock %}
