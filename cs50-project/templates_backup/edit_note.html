{% extends "layout.html" %}

{% block title %}
Edit Note
{% endblock %}

{% block content %}

<h2>Edit Note</h2>

<form action="{{ url_for('edit_note', id=note.id) }}" method="POST">

<div class="mb-3">

<label class="form-label">Subject</label>

<select class="form-select" name="subject_id">

{% for subject in subjects %}

<option value="{{ subject.id }}"
{% if subject.id == note.subject_id %}
selected
{% endif %}>

{{ subject.subject_name }}

</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label class="form-label">Title</label>

<input
class="form-control"
type="text"
name="title"
value="{{ note.title }}"
required>

</div>

<div class="mb-3">

<label class="form-label">Content</label>

<textarea
class="form-control"
rows="8"
name="content"
required>{{ note.content }}</textarea>

</div>

<button class="btn btn-complete" type="submit">
Save Changes
</button>

</form>

{% endblock %}
