{% extends "layout.html" %}

{% block title %}
Dashboard
{% endblock %}

{% block content %}

<h2 class="mb-4">Dashboard</h2>
<div class="mb-4">

<a href="/add_subject" class="btn btn-add-subject">+ Subject</a>

<a href="/add_note" class="btn btn-add-note">+ Note</a>

<a href="/add_assignment" class="btn btn-add-assignment">+ Assignment</a>

</div>

<div class="row g-4">

<div class="col-md-3">
<div class="card shadow text-center">
<div class="card-body">

<i class="bi bi-book fs-1 text-primary"></i>

<h5 class="mt-3">Subjects</h5>

<h2>{{ subjects }}</h2>

</div>
</div>
</div>

<div class="col-md-3">
<div class="card shadow text-center">
<div class="card-body">

<i class="bi bi-journal-text fs-1 text-success"></i>

<h5 class="mt-3">Notes</h5>

<h2>{{ notes }}</h2>

</div>
</div>
</div>

<div class="col-md-3">
<div class="card shadow text-center">
<div class="card-body">

<i class="bi bi-clipboard-check fs-1 text-warning"></i>

<h5 class="mt-3">Assignments</h5>

<h2>{{ assignments }}</h2>

</div>
</div>
</div>

<div class="col-md-3">
<div class="card shadow text-center">
<div class="card-body">

<i class="bi bi-alarm fs-1 text-danger"></i>

<h5 class="mt-3">Pending</h5>

<h2>{{ pending }}</h2>

</div>
</div>
</div>

</div>

{% endblock %}
