{% extends "layout.html" %}

{% block title %}
Add Note
{% endblock %}

{% block content %}

<h2>Add Note</h2>

<form action="{{ url_for('add_note') }}" method="POST">

    <div class="mb-3">

        <label class="form-label">Subject</label>

        <select class="form-select" name="subject_id" required>

            <option value="">Select Subject</option>

            {% for subject in subjects %}

            <option value="{{ subject.id }}">
                {{ subject.subject_name }}
            </option>

            {% endfor %}

        </select>

    </div>

    <div class="mb-3">

        <label class="form-label">Title</label>

        <input
            type="text"
            class="form-control"
            name="title"
            required>

    </div>

    <div class="mb-3">

        <label class="form-label">Content</label>

        <textarea
            class="form-control"
            rows="6"
            name="content"
            required></textarea>

    </div>

    <button type="submit" class="btn btn-add w-100 mt-2">
        Save Note
    </button>

</form>

{% endblock %}
