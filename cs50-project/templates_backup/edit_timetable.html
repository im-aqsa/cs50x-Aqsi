{% extends "layout.html" %}

{% block title %}
Edit Timetable
{% endblock %}

{% block content %}

<h2>Edit Class</h2>

<form action="{{ url_for('edit_timetable', id=row.id) }}" method="POST">

<div class="mb-3">

<label>Subject</label>

<select class="form-select" name="subject">

{% for subject in subjects %}

<option value="{{ subject.subject_name }}"
{% if subject.subject_name == row.subject %}selected{% endif %}>
{{ subject.subject_name }}
</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label>Day</label>

<select class="form-select" name="day">

{% for d in ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"] %}

<option value="{{ d }}"
{% if d == row.day %}selected{% endif %}>
{{ d }}
</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label>Start Time</label>

<input
type="time"
class="form-control"
name="start_time"
value="{{ row.start_time }}"
required>

</div>

<div class="mb-3">

<label>End Time</label>

<input
type="time"
class="form-control"
name="end_time"
value="{{ row.end_time }}"
required>

</div>

<button class="btn btn-complete">
Save Changes
</button>

</form>

{% endblock %}
